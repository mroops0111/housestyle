extends: existence
message: "Date '%s' in a comment. Keep it if it names a version. If it records when something changed, state the current constraint instead."
level: warning
nonword: true
tokens:
  - '\b\d{4}-\d{2}-\d{2}\b'
  - '\b\d{4}/\d{1,2}/\d{1,2}\b'
  - '\b\d{1,2}/\d{1,2}/\d{4}\b'
  - '\b(?:Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Sept|Oct|Nov|Dec)[a-z]*\.? \d{1,2},? \d{4}\b'
  - '\b\d{1,2} (?:Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Sept|Oct|Nov|Dec)[a-z]* \d{4}\b'
  - '\b(?:January|February|March|April|May|June|July|August|September|October|November|December) \d{4}\b'
  - '\b(?:[Aa]s of|[Ss]ince|[Uu]ntil) (?:Q[1-4] )?\d{4}\b'
  - '\b[Ii]n Q[1-4] \d{4}\b'
