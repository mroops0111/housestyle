name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --extra dev
      - run: uv run ruff check src/ tests/
      - run: uv run ruff format --check src/ tests/

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --extra dev
      - run: uv run basedpyright src/ tests/

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - run: uv sync --extra dev

      # Without these, every test against a real tool skips and the self-hosting check runs neither.
      - name: Install Vale
        env:
          VALE_VERSION: 3.18.0
        run: |
          curl -sSfL "https://github.com/errata-ai/vale/releases/download/v${VALE_VERSION}/vale_${VALE_VERSION}_Linux_64-bit.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP" vale
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Install AutoCorrect
        env:
          AUTOCORRECT_VERSION: 2.16.3
        run: |
          curl -sSfL "https://github.com/huacnlee/autocorrect/releases/download/v${AUTOCORRECT_VERSION}/autocorrect-linux-amd64.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP" autocorrect

      - name: Confirm delegated tools
        run: |
          vale --version
          autocorrect --version

      - run: uv run pytest tests/ -v --tb=short

      - name: Self-hosting
        run: uv run subedit check src/ tests/

  prose:
    name: Prose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: errata-ai/vale-action@reviewdog
        with:
          version: 3.18.0
          files: src tests README.md
          fail_on_error: true
          reporter: github-check

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test, prose]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv build
