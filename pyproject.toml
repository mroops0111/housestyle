[project]
name = "commentprose"
version = "0.0.1"
description = "A linter and formatter for the prose inside code comments, across languages."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "mroops0111", email = "mroops0111@gmail.com" }]
keywords = ["linter", "formatter", "comments", "prose", "lsp", "tree-sitter"]
classifiers = [
    "Development Status :: 1 - Planning",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/mroops0111/commentprose"
Repository = "https://github.com/mroops0111/commentprose"

[project.scripts]
commentprose = "commentprose.presentation.cli:main"
cprose = "commentprose.presentation.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/commentprose"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.14",
    "basedpyright>=1.31",
]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "F", "E", "W", "I", "N", "UP", "B", "A", "C4",
    "SIM", "RET", "ARG", "PTH", "ERA", "RUF", "S",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.basedpyright]
typeCheckingMode = "strict"
pythonVersion = "3.11"
include = ["src", "tests"]
reportMissingTypeStubs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "--cov=commentprose",
    "--cov-report=term-missing",
    "--cov-fail-under=80",
    "--strict-markers",
]

[tool.coverage.run]
source = ["src/commentprose"]
branch = true
